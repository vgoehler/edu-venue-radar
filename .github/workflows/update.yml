name: crawl and build

on:
  schedule:
    - cron: "17 5 * * 1"  # Mondays 05:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [registry.yaml, edu_venue_radar/**, tests/**, pyproject.toml, poetry.lock]
  pull_request:

permissions:
  contents: read

concurrency:
  group: update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pinned to commits; Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      # Install the locked versions from poetry.lock, not the newest matching ones.
      - run: pip install --require-hashes -r .github/ci-requirements.txt && poetry install
      - run: poetry run edu-venue-radar --root . check
      - run: poetry run ruff check .
      - run: poetry run mypy
      - run: poetry run pytest -q

  update:
    # Only main publishes; pull requests stop after the tests.
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The write token is not stored in .git/config; only the commit step below gets it.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install --require-hashes -r .github/ci-requirements.txt && poetry install --only main
      # A failing ranking portal must not stop the crawl.
      - run: poetry run edu-venue-radar --root . icore || echo "ICORE lookup failed, keeping the last ranks"
        if: github.event_name != 'push'
      - run: poetry run edu-venue-radar --root . crawl
        if: github.event_name != 'push'
      - run: poetry run edu-venue-radar --root . build
      - name: commit
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "edu-venue-radar bot"
          git config user.email "edu-venue-radar@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && exit 0
          git commit -m "weekly crawl $(date -u +%F)"
          git push "https://x-access-token:${TOKEN}@github.com/${REPO}.git" HEAD:main
