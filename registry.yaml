# Digital Education Venue Radar: registry of conference series.
#
# One entry per series. `editions` is keyed by the year the conference takes place.
#
# Edition fields (all optional):
#   url              page of this edition, or of the previous one as a fallback (then set url_is_fallback)
#   location         where it takes place
#   start, end       ISO dates of the conference
#   when             free text while the dates are not known ("September 2027")
#   calls            one entry per call, keyed by kind (workshops, papers, special-sessions, ...):
#     deadline       ISO date, only when confirmed on the official page
#     deadline_hint  ISO date of the previous cycle's deadline, shown as "typically"
#     note           free text (formats in the call, provisional dates, notification)
#     closed         true when the call is known to be over without a date
#
# Series fields:
#   url_pattern        edition page with {year} / {yy}; the crawler probes it for the next year
#   deadlines_pattern  separate page with the dates, crawled together with the edition page
#   icore              acronym in the ICORE portal, or null for venues ICORE does not list
#   keywords           words the crawler looks for next to dates
#   layout             prose (default) or date-first for pages that list "date label date label"
#
# `edu-venue-radar roll <id>` appends the next edition from the last one.

